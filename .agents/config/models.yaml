# Fonte executável de roteamento; versões não pertencem à skill.
# Entradas em flow-style: os wrappers leem apenas a seção e o papel pedidos.
# Codex: CODEX_DELEGATE_MODEL > roles.<papel>.model > default do wrapper.
# Modelo session exige CODEX_DELEGATE_MODEL igual ao modelo do root.
# Leitura/revisão: sandbox obrigatório; reviewer nunca faz fallback automático.
# Fallback só é usado uma vez, por indisponibilidade, com capacidade compatível.
last-updated: 2026-10-04
roles:
  coder:     { model: gpt-6.1-sol, effort: medium, timeout: 2700, sandbox: workspace-write, fallback: none }
  reviewer:  { model: gpt-6.1-sol, effort: high, timeout: 1200, sandbox: read-only, fallback: none }
  architect: { model: gpt-6.1-sol, effort: high, timeout: 2400, sandbox: read-only, fallback: none }
  maestro:   { model: session, effort: high, timeout: 1800, sandbox: workspace-write, fallback: none }
  leaf:      { model: gpt-6-luna, effort: low, timeout: 900, sandbox: read-only, fallback: none }
  fast:      { model: gpt-6-luna, effort: low, timeout: 900, sandbox: workspace-write, fallback: none }

# Claude: --model explícito > claude.<papel>.model > default do adaptador.
# Aliases confirmados no CLI; identidade real exige evidência da resposta.
# Alternativa do Maestro interativo é manual; o adaptador headless limita a uma.
claude:
  maestro:        { model: fable, fallback: opus, timeout: 1800 }
  architect:      { model: fable, fallback: opus, timeout: 2400 }
  coder:          { model: opus, fallback: none, timeout: 2700 }
  reviewer:       { model: opus, fallback: none, timeout: 1200 }
  investigator:   { model: fable, fallback: opus, timeout: 2400 }
  contextualizer: { model: sonnet, fallback: none, timeout: 900 }
  cheap:          { model: sonnet, fallback: none, timeout: 900 }
