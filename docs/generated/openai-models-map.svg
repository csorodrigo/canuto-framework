    <text x="132" y="552" fill="#17384A" font-size="18" font-weight="600">Codeforces: 90</text>
    <text x="132" y="579" fill="#17384A" font-size="18" font-weight="600">GPQA Diamond: 79</text>
    <text x="132" y="607" fill="#A05A31" font-size="15">4/4 reliability was the headline:</text>
    <text x="132" y="628" fill="#A05A31" font-size="15">AIME 80, Codeforces 75, GPQA 74</text>

