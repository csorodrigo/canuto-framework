name: Apply explicit commit consent

on:
  push:
    branches:
      - codex/explicit-commit-consent-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.ref_name == 'codex/explicit-commit-consent-20260823' || github.head_ref == 'codex/explicit-commit-consent-20260823')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/explicit-commit-consent-20260823
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python3 tools/fix-explicit-consent-patcher.py
          python3 tools/apply-explicit-commit-consent.py
          python3 tools/refine-explicit-consent-output.py

      - name: Validate syntax and behavioral gates
        run: |
          /bin/bash -n install.sh
          /bin/bash -n .agents/tools/canuto-update-all.sh
          /bin/bash -n test-framework.sh
          node --test skill-gardener/canuto-skill-gardener.test.js
          /bin/bash test-framework.sh
          git diff --check

      - name: Remove one-shot automation
        run: |
          rm -f tools/fix-explicit-consent-patcher.py
          rm -f tools/apply-explicit-commit-consent.py
          rm -f tools/refine-explicit-consent-output.py
          rm -f .github/workflows/apply-explicit-commit-consent.yml

      - name: Commit hardened result
        run: |
          git config user.name "canuto-hardening-bot"
          git config user.email "canuto-hardening-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(consent): require explicit authorization for Git commits"
          git push origin HEAD:codex/explicit-commit-consent-20260823
