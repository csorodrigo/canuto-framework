name: Apply source channels and receipts

on:
  push:
    branches:
      - codex/stable-edge-source-pinning-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.ref_name == 'codex/stable-edge-source-pinning-20260823' || github.head_ref == 'codex/stable-edge-source-pinning-20260823')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/stable-edge-source-pinning-20260823
          fetch-depth: 0

      - name: Apply guarded source-channel patch
        run: python3 tools/apply-source-channels.py

      - name: Validate source-channel implementation
        run: |
          /bin/bash -n install.sh
          /bin/bash -n .agents/tools/canuto-update-all.sh
          /bin/bash -n .agents/tools/canuto-consumer-smoke.sh
          /bin/bash -n test-framework.sh
          node --test skill-gardener/canuto-skill-gardener.test.js
          /bin/bash test-framework.sh
          git diff --check

      - name: Remove one-shot automation
        run: |
          rm -f tools/apply-source-channels.py
          rm -f .github/workflows/apply-source-channels.yml

      - name: Commit source-channel implementation
        run: |
          git config user.name "canuto-hardening-bot"
          git config user.email "canuto-hardening-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(release): add stable edge pinning and source receipts"
          git push origin HEAD:codex/stable-edge-source-pinning-20260823
